name: Deploy component showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/showcase/package-lock.json
      - run: npm ci
      - run: npm ci --prefix examples/showcase
      - run: npm run build --prefix examples/showcase
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/showcase/dist
      - id: deployment
        uses: actions/deploy-pages@v4
